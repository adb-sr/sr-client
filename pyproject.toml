[project]
name = "sr-client"
version = "0.1.0"
description = "Python client for the Sentinel-2 super-resolution service (sen4x-v2)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "rioxarray>=0.15"]
viz = ["matplotlib>=3.7", "pillow>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sr_client"]

[tool.ruff]
line-length = 100
target-version = "py39"
